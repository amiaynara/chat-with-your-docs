[project]
name = "chat-with-your-docs"
version = "0.1.0"
description = "RAG assistant backend (FastAPI + Celery)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "boto3>=1.35",
    "pypdf>=5.1",
    "openai>=1.54",
    "anthropic>=0.39",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "google-genai>=2.23.0",
    "httpx>=0.28",
    "cohere>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
    "moto[secretsmanager]>=5.2.3",
]

# LocalEmbeddingProvider (app/adapters/embeddings.py) only ever runs on CPU — Docker
# Desktop doesn't pass a GPU into containers, and this app has no other use for a GPU
# build of torch. The default PyPI torch wheel bundles CUDA runtime libraries as
# transitive deps regardless (multiple GB, useless here), so pin torch to the
# official CPU-only wheel index instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: real external-service contract tests, excluded from the default run",
]
addopts = "-m 'not integration'"

[tool.coverage.report]
# 100% is only meaningful across the full suite (fast + integration) — the
# integration tests are the only thing exercising the real adapters'
# network-client code paths (storage.py's real MinIO round trip, etc).
# Run: uv run pytest -m "integration or not integration" --cov=app
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI's `Depends(...)` in a default argument is the idiomatic DI pattern
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
