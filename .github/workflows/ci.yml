name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Test
        run: uv run pytest -q

  backend-integration:
    # Fast + integration tests together, with full coverage. Kept as its own
    # job (rather than folded into `backend`) per the spec's testing
    # decisions: contract/integration tests against real adapters are
    # "excluded from the default fast CI run; run separately/manually or in
    # a dedicated CI job".
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Start MinIO
        # The official minio image needs a `server /data` command, which
        # GitHub Actions' `services:` block has no way to supply (no
        # `command:` field) — so it's run as a plain container instead.
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Test (fast + integration, with coverage)
        run: uv run pytest -m "integration or not integration" --cov=app --cov-report=term-missing

  eval:
    # Runs the evaluation harness (backend/app/eval, issue #13) as its own CI job,
    # distinct from lint/tests, so hit-rate/faithfulness/rerank-delta are a
    # measured-on-every-push number, not just something a developer might
    # remember to run manually.
    #
    # Unlike the rest of this repo's CI, this can't run against fakes — it needs two
    # real providers:
    #   - LLM-as-judge: EMBEDDING_PROVIDER defaults to "local" (see app/config.py),
    #     so embeddings need no real provider/key at all here. Answering/judging
    #     still needs a real LLM; this job uses the free option already built in
    #     (LLM_PROVIDER=google — see docs/llm-providers.md) instead of the paid
    #     Anthropic default, specifically to avoid needing a paid secret for this.
    #     Needs GOOGLE_API_KEY.
    #   - Reranking: the harness runs the golden set through both vector-only and
    #     vector+rerank modes to measure the reranker's actual contribution (the
    #     whole point of the "rerank delta" it reports) — Cohere is the only
    #     RerankerProvider this app implements (issue #12), no free/local
    #     alternative exists. Needs COHERE_API_KEY.
    #
    # Skipped entirely when those aren't configured as repo secrets — keeping CI
    # green (and free) on a fork/clone without them, same as the rest of this
    # project's "works without paid keys" default. Configure GOOGLE_API_KEY and
    # COHERE_API_KEY as repository secrets to turn this job on.
    if: ${{ secrets.GOOGLE_API_KEY != '' && secrets.COHERE_API_KEY != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/app
      LLM_PROVIDER: google
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run evaluation harness
        run: uv run python -m app.eval | tee eval-output.txt

      - name: Publish results to the job summary
        if: always()
        run: |
          {
            echo "## Evaluation harness results"
            echo '```'
            cat eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  infra:
    # Synthesizes the CDK stack (infra/, issue #23) and runs its assertion tests
    # against the real CloudFormation output — no AWS credentials needed, since this
    # never deploys anything (issue #28's live cutover is deliberately deferred; see
    # infra/README.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          .venv/bin/pip install ruff
          .venv/bin/ruff check --select E,F,I,UP,B --line-length 100 .

      - name: Synthesize + test
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1
        run: .venv/bin/python -m pytest tests/ -v
